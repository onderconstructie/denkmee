// Plan de gebeurtenissen waarvan het begin tussen film-tijd van en tot valt. nul is de contexttijd
// die bij 'van' hoort. Bij het eerste venster klinkt wat al bezig was, vanaf het juiste punt verder.
function planGeluid(K, lijst, van, tot, nul, eerste){
  for (const e of lijst){
    const begin = e.t - (e.voor || 0);
    K.niveau = NIVEAU[e.soort] ?? 1;
    if (e.tot !== undefined){
      if (begin >= van && begin < tot) KLANK[e.soort](K, e, nul + (e.t - van), 0);
      else if (eerste && begin < van && e.tot > van + .3) KLANK[e.soort](K, e, nul, van - e.t);
    } else if (begin >= van && begin < tot) KLANK[e.soort](K, e, nul + (e.t - van));

}
function geluidLijst(){ return MODULES.flatMap(m => m.geluid ? m.geluid() : []).sort((a, b) => a.t - b.t); }

// Voor exporteer.py: het geluid van van tot tot, in één keer uitgerekend, als WAV (16 bit, stereo,
// 48 kHz) in stukken base64, zodat het door de verbinding met het script past.
async function geluidWav(van = 0, tot = TL.duur){
  const sr = 48000, n = Math.max(1, Math.round((tot - van) * sr));
  const oc = new OfflineAudioContext(2, n, sr);
  planGeluid(maakKlankbord(oc, oc.destination), geluidLijst(), van, tot, 0, true);
  const buf = await oc.startRendering();
  const L = buf.getChannelData(0), R = buf.getChannelData(1), bytes = new Uint8Array(44 + n * 4), dv = new DataView(bytes.buffer);
  const tekst = (o, s) => { for (let i = 0; i < s.length; i++) bytes[o + i] = s.charCodeAt(i); };
  tekst(0, 'RIFF'); dv.setUint32(4, 36 + n * 4, true); tekst(8, 'WAVEfmt '); dv.setUint32(16, 16, true);
  dv.setUint16(20, 1, true); dv.setUint16(22, 2, true); dv.setUint32(24, sr, true); dv.setUint32(28, sr * 4, true);
  dv.setUint16(32, 4, true); dv.setUint16(34, 16, true); tekst(36, 'data'); dv.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++){
    dv.setInt16(44 + i * 4, klem(L[i], -1, 1) * 32767, true);
    dv.setInt16(46 + i * 4, klem(R[i], -1, 1) * 32767, true);
  }

  for (let o = 0; o < bytes.length; o += STUK){
    const deel = bytes.subarray(o, o + STUK);
    let s = '';
    for (let i = 0; i < deel.length; i += 32768) s += String.fromCharCode.apply(null, deel.subarray(i, i + 32768));
    stukken.push(btoa(s));
  }

}

const Q = new URLSearchParams(location.search);
const OPNAME = Q.get('opname') === '1';
const RUSTIG = !OPNAME && matchMedia('(prefers-reduced-motion: reduce)').matches;
// De versie komt uit ?versie=, of uit #herwerkt: een kaal anker komt ook door waar ?-opties wegvallen.
const ANKER = location.hash.slice(1);
let VKEY = VERSIES[Q.get('versie')] ? Q.get('versie') : VERSIES[ANKER] ? ANKER : 'origineel';
let V, TL, MODULES = [];
let T = 0, SPEELT = false, VORIGE = null, OT_AAN = Q.get('ondertitels') !== '0';

// Het geluid tijdens het afspelen: telkens het komende stukje inplannen. Het beeld volgt dan de klok
// van het geluid, zodat beide gelijk blijven lopen, ook als het venster even hapert.
const GELUID = {
  aan: true, ctx: null, K: null, bus: null, lijst: [], gepland: 0, T0: 0, c0: 0,
  kan(){ return !OPNAME && !!(window.AudioContext || window.webkitAudioContext); },
  start(t){
    this.stop();

    } catch (fout){ return; }

    this.gepland = tot;
  },
  stop(){

const ICOON_GELUID = 'M3 9v6h4l5 4V5L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z';
const ICOON_STIL = 'M3 9v6h4l5 4V5L7 9zm12.1-.5l2.4 2.4 2.4-2.4 1.1 1.1-2.4 2.4 2.4 2.4-1.1 1.1-2.4-2.4-2.4 2.4-1.1-1.1 2.4-2.4-2.4-2.4z';

const $ = id => document.getElementById(id);
const ond = $('onderschrift'), ondRegel = ond.querySelector('.regel'), ondVert = ond.querySelector('.vertaling');

function bouw(sleutel){
  VKEY = sleutel; V = VERSIES[sleutel]; TL = bouwTijdlijn(V);
  const lagen = $('lagen'), dyn = $('dyn');
  lagen.textContent = ''; dyn.textContent = '';
  MODULES = [maakSluimer, maakArchief, maakNudge, maakKeuze, maakKorrel].map(f => f(el('g', {}, lagen), dyn));
  GELUID.lijst = geluidLijst();
  if (SPEELT) GELUID.start(T);
  T = klem(T, 0, TL.duur);
  $('kiesVersie').value = sleutel;
  controleerOndertitels();
  vulScript();
  teken();
}

function teken(){
  for (const m of MODULES) m.render(T);
  toonOnderschrift();
  if (!OPNAME) balkBij();
}

function toonOnderschrift(){
  let c = null;
  if (OT_AAN) for (const x of TL.cues) if (T >= x.a - .12 && T < x.b + .12){ c = x; break; }
  if (!c){ ond.style.opacity = 0; return; }
  if (ond._c !== c){
    ond._c = c;
    ondRegel.textContent = breek(c.tekst, c.dialect ? 40 : 46).join('\n');
    ondVert.textContent = c.vertaling || '';
    ondVert.style.display = c.vertaling ? '' : 'none';
    ond.classList.toggle('dialect', !!c.dialect);
  }
  // Een ondertitel komt zacht omhoog als hij verschijnt; weg gaat hij met een fade.
  const op = fase(T, c.a - .12, c.a + .08);
  ond.style.opacity = Math.min(op, 1 - fase(T, c.b - .02, c.b + .12)).toFixed(3);
  ond.style.transform = `translate(-50%, ${((1 - E.uit3(op)) * .5).toFixed(3)}cqw)`;
}

// Leesbaarheid: een ondertitel mag niet sneller gaan dan ongeveer 17 tekens per seconde.
function controleerOndertitels(){
  for (const c of TL.cues){
    const cps = c.tekst.length / (c.b - c.a);
    if (cps > 17 && !c.dialect) console.warn(`Ondertitel te snel (${cps.toFixed(1)} tekens/s): ${c.tekst}`);
  }
}

const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function huidigeScene(){ let i = 0; TL.scenes.forEach((s, j) => { if (T >= s.start) i = j; }); return i; }
function balkBij(){
  $('tijd').textContent = `${mmss(T)} / ${mmss(TL.duur)}`;
  if (!balkBij.sleept) $('schuif').value = Math.round(1000 * T / TL.duur);
  const i = huidigeScene();
  $('sceneNaam').textContent = `${i + 1} · ${TL.scenes[i].titel}`;
  $('icoonSpeel').setAttribute('d', SPEELT ? 'M6 4h4v16H6zm8 0h4v16h-4z' : 'M6 3.5v17l14-8.5z');
  $('knopSpeel').setAttribute('aria-label', SPEELT ? 'Pauzeren' : 'Afspelen');
}

function lus(nu){
  if (!SPEELT) return;
  if (VORIGE !== null) T = Math.min(TL.duur, T + Math.min(.1, (nu - VORIGE) / 1000));
  VORIGE = nu;
  const ta = GELUID.tijd();
  if (ta !== null && Math.abs(ta - T) > .03) T = klem(ta, 0, TL.duur);
  GELUID.plan(T);
  teken();
  if (T >= TL.duur){ SPEELT = false; GELUID.stop(); balkBij(); return; }
  requestAnimationFrame(lus);
}
function speel(){ if (T >= TL.duur - .05) T = 0; SPEELT = true; VORIGE = null; $('grootSpelen').hidden = true; GELUID.start(T); requestAnimationFrame(lus); balkBij(); }
function pauze(){ SPEELT = false; GELUID.stop(); balkBij(); }
function wissel(){ SPEELT ? pauze() : speel(); }
// Wie verspringt, wil het beeld zien: de grote afspeelknop gaat dan weg.
function naar(t){ T = klem(t, 0, TL.duur); if (!OPNAME) $('grootSpelen').hidden = true; if (SPEELT) GELUID.start(T); teken(); }

function vulScript(){
  const lijst = $('scriptlijst');
  lijst.textContent = '';
  const n = document.createElement('div');
  n.className = 'notities';
  n.innerHTML = `<p>${V.naam}</p><ul></ul>`;
  for (const t of V.notities){ const li = document.createElement('li'); li.textContent = t; n.querySelector('ul').appendChild(li); }
  lijst.appendChild(n);
  TL.scenes.forEach((s, i) => {
    const h = document.createElement('h2');
    h.textContent = `${i + 1} · ${s.titel}`;
    const sp = document.createElement('span'); sp.textContent = `${mmss(s.start)}–${mmss(s.eind)}`; h.appendChild(sp);
    lijst.appendChild(h);
    const ol = document.createElement('ol');
    for (const c of s.cues){
      const li = document.createElement('li'), b = document.createElement('button');
      b.type = 'button';
      b.innerHTML = '<span class="tc"></span><span class="zin"></span>';
      b.querySelector('.tc').textContent = mmss(c.a);
      const zin = b.querySelector('.zin');
      if (c.dialect){ const i2 = document.createElement('i'); i2.textContent = c.tekst; zin.appendChild(i2); } else zin.textContent = c.tekst;
      if (c.vertaling){ const v2 = document.createElement('span'); v2.className = 'vert'; v2.textContent = `In beeld: ${c.vertaling}`; zin.appendChild(v2); }
      b.addEventListener('click', () => { naar(c.a - .3); window.scrollTo({ top: 0, behavior: 'smooth' }); });
      li.appendChild(b); ol.appendChild(li);

function srt(){
  const f = s => { const ms = Math.round(s * 1000);
    return [ms / 3600000, ms / 60000 % 60, ms / 1000 % 60].map(x => String(Math.floor(x)).padStart(2, '0')).join(':') + ',' + String(ms % 1000).padStart(3, '0'); };
  return TL.cues.map((c, i) => {
    const regels = c.dialect ? breek(c.tekst).map(r => `<i>${r}</i>`).concat(breek(c.vertaling)) : breek(c.tekst);
    return `${i + 1}\n${f(c.a)} --> ${f(c.b)}\n${regels.join('\n')}\n`;
  }).join('\n');
}

function koppelBediening(){
  $('knopSpeel').addEventListener('click', wissel);
  $('grootSpelen').addEventListener('click', speel);
  $('doek').addEventListener('click', e => { if (e.target.closest('#grootSpelen')) return; wissel(); });
  const schuif = $('schuif');
  schuif.addEventListener('input', () => { balkBij.sleept = true; naar(TL.duur * schuif.value / 1000); });
  schuif.addEventListener('change', () => { balkBij.sleept = false; });
  $('kiesVersie').addEventListener('change', e => {
    bouw(e.target.value);
    // Het adres volgt de keuze, zodat een gekopieerde link dezelfde versie opent. In een afgeschermd
    // venster kan dat geweigerd worden; de speler werkt dan gewoon verder.

  ot.addEventListener('click', () => zetOT(!OT_AAN));

  const zetGeluid = aan => {
    GELUID.aan = aan;
    kg.setAttribute('aria-pressed', String(aan));
    $('icoonGeluid').setAttribute('d', aan ? ICOON_GELUID : ICOON_STIL);
    if (SPEELT){ if (aan) GELUID.start(T); else GELUID.stop(); }
  };
  kg.addEventListener('click', () => zetGeluid(!GELUID.aan));
  kg.hidden = !GELUID.kan();

  const vol = () => {
    try { (document.fullscreenElement ? document.exitFullscreen() : $('doek').requestFullscreen?.())?.catch?.(() => {}); }
    catch (fout) {}
  };
  $('knopVol').addEventListener('click', vol);
  // De ondertitels naar het klembord, om te plakken in een bestand op .srt. Een downloadknop werkt
  // niet overal (op claude.ai mag een pagina geen .srt aanbieden); kopiëren wel. Lukt ook dat niet,
  // dan verschijnt de tekst om zelf te selecteren. Als bestand schrijft exporteer.py de .srt.

    };

      navigator.clipboard.writeText(tekst)

    if (e.target.closest('select, input') && e.key !== ' ') return;

    else if (e.key === 'ArrowRight') naar(T + 5);
    else if (e.key === 'ArrowLeft') naar(T - 5);
    else if (e.key === 'Home') naar(0);
    else if (e.key === 'c') zetOT(!OT_AAN);
    else if (e.key === 'm') zetGeluid(!GELUID.aan);
    else if (e.key === 'f') vol();
    else if (/^[1-5]$/.test(e.key)) naar(TL.scenes[+e.key - 1].start);
  });
}

async function laadLetters(){
  await Promise.all((window.LETTERTYPES || []).map(async f => {
    try {
      const ff = new FontFace(f.familie, `url(data:font/woff2;base64,${f.data})`, { weight: f.gewicht, style: f.stijl });

    } catch (fout){ console.warn('Lettertype niet geladen:', f.familie, fout); }
  }));
}

  klaar: false,
  get duur(){ return TL.duur; },

  srt,
  geluidWav,
  get versie(){ return VKEY; },
  get tijdlijn(){ return TL; },
};

});
